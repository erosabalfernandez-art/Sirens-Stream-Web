<svg viewBox="0 0 96 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="96" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hg" x1="28" y1="8" x2="68" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo -->
  <ellipse cx="48" cy="9" rx="10" ry="5.5" stroke="url(#hg)" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.95"/>

  <!-- Left Wing -->
  <path d="
    M 48 30
    C 43 24 30 14 10 18
    C 14 20 20 24 24 30
    C 16 28  8 30  6 38
    C 12 34 20 34 26 38
    C 18 40 12 46 14 54
    C 20 48 28 46 34 50
    L 48 52
    Z
  " fill="url(#wg)" filter="url(#glow)" opacity="0.95"/>

  <!-- Left Wing inner feather lines -->
  <path d="M 37 28 C 26 26 14 26 10 29" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M 34 36 C 22 35 12 37 8 41" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M 32 44 C 22 44 14 48 13 53" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>

  <!-- Right Wing (mirror) -->
  <path d="
    M 48 30
    C 53 24 66 14 86 18
    C 82 20 76 24 72 30
    C 80 28 88 30 90 38
    C 84 34 76 34 70 38
    C 78 40 84 46 82 54
    C 76 48 68 46 62 50
    L 48 52
    Z
  " fill="url(#wg)" filter="url(#glow)" opacity="0.95"/>

  <!-- Right Wing inner feather lines -->
  <path d="M 59 28 C 70 26 82 26 86 29" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M 62 36 C 74 35 84 37 88 41" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>
  <path d="M 64 44 C 74 44 82 48 83 53" stroke="white" stroke-width="0.7" opacity="0.22" stroke-linecap="round"/>

  <!-- Center sparkle -->
  <circle cx="48" cy="30" r="2" fill="white" opacity="0.55" filter="url(#glow)"/>
</svg>
